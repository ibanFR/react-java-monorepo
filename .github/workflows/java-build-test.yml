name: Java Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/java-build-test.yml'
  pull_request:
    branches: [ main ]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'

  java-build-and-test:
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Java version from pom.xml
        id: java-version
        run: echo "version=$(mvn help:evaluate -Dexpression=maven.compiler.release -q -DforceStdout)" >> $GITHUB_OUTPUT
        working-directory: backend

      - name: Set up JDK ${{ steps.java-version.outputs.version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  skip-check:
    needs: filter
    if: needs.filter.outputs.backend != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No backend changes, skipping the build"
