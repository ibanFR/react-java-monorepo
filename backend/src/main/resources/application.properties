# ---------------------------------------------------------------------------
# Datasource ? H2 in-memory for development; switch to PostgreSQL in production
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------------
# HTTP / CORS ? allow the Vite dev server on port 5173
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.headers=Content-Type,Accept,Authorization
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
